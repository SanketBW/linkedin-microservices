server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: post-service
              uri: lb://POST-SERVICE
              predicates:
                - Path=/api/posts/**

            - id: feed-service
              uri: lb://POST-SERVICE
              predicates:
                - Path=/api/feed/**

            - id: connection-service
              uri: lb://CONNECTION-SERVICE
              predicates:
                - Path=/api/connections/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt-secreteKey: ${JWT_SECRET}